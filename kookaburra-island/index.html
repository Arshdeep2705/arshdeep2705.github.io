<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kookaburra Island</title>
<meta name="description" content="Brain games for little explorers and their grown-ups: memory, listening, patterns, shadows, counting and sorting on an Aussie bush island.">
<meta property="og:title" content="Kookaburra Island">
<meta property="og:description" content="Brain games for little explorers and their grown-ups. Play together on one screen.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#74cbe8">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen storybook app. A painted Aussie-bush scene sits behind everything; HUD pods for each explorer on top;
   a thick-bordered paper "board" in the middle for each game; Kooka the kookaburra is the guide who talks. Single bright daytime world. */
:root{
  --sky:#8fd8ec; --gum:#3c8d68; --gum-deep:#1d5b45; --earth:#cf5f34; --wattle:#ffc83a; --wattle-deep:#d99a10;
  --paper:#fffdf7; --ink:#2a2840; --ink-soft:#5f5b7c; --mist:#eef6f1; --water:#3fa7d6;
  --font-display:'Fredoka','Baloo 2','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --font-body:'Nunito',ui-rounded,system-ui,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --shadow:0 10px 0 rgba(29,91,69,.16),0 26px 50px rgba(42,40,64,.2);
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:#ffe3b8;color:var(--ink);font-family:var(--font-body);font-weight:700;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
input{user-select:text;-webkit-user-select:text}
.e{font-family:var(--emoji);line-height:1;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- painted world ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;background:#bfe8ef}
#world svg{width:100%;height:100%;display:block}
.rays{animation:spin 70s linear infinite;transform-origin:0 0}
.cloud{animation:drift var(--dur) linear infinite;animation-delay:var(--del);opacity:.93}
.flock{animation:fly 48s linear infinite;animation-delay:-12s}
.flock path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 7s ease-in-out infinite alternate;transform-origin:0 0}
.tw{animation:twinkle 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1920px)}}
@keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(1800px,-60px)}}
@keyframes flap{to{transform:scaleY(.4)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.9}}

/* ---------- app frame ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
body.dock-on #stage{padding-bottom:clamp(112px,19vmin,165px)}
.screen{min-height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vmin,22px);
  animation:screenIn .55s cubic-bezier(.2,1.3,.4,1) both;padding-block:6px}
.screen.fill{height:100%;min-height:0}
@keyframes screenIn{from{opacity:0;transform:translateY(26px) scale(.96)}}
.h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vmin,54px);margin:0;text-align:center;text-wrap:balance;color:var(--ink);
  text-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 7px 0 rgba(29,91,69,.25)}

.btn-big{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5.4vmin,46px);padding:.36em 1.3em .42em;border-radius:999px;
  background:var(--wattle);color:var(--ink);box-shadow:0 8px 0 var(--wattle-deep),0 18px 30px rgba(42,40,64,.22);
  display:inline-flex;align-items:center;gap:.35em;transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn-big:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--wattle-deep),0 8px 16px rgba(42,40,64,.2)}
.btn-big:disabled{filter:saturate(.3);opacity:.6}
.btn-big.alt{background:#fff;box-shadow:0 8px 0 #cfd8d2,0 18px 30px rgba(42,40,64,.18)}
.btn-big.go-pulse:not(:disabled){animation:goPulse 1.6s ease-in-out infinite}
@keyframes goPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.btn-link{font-family:var(--font-display);font-weight:600;font-size:clamp(16px,2.6vmin,20px);color:var(--gum-deep);background:rgba(255,255,255,.75);
  padding:.45em 1em;border-radius:999px}

/* ---------- HUD ---------- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:none}
.pod{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 14px 4px 4px;
  border:4px solid transparent;transition:transform .3s cubic-bezier(.3,1.6,.5,1),border-color .3s,box-shadow .3s;min-width:0;justify-self:start;max-width:100%}
.pod--r{flex-direction:row-reverse;padding:4px 4px 4px 14px;justify-self:end;text-align:right}
.pod .av{width:clamp(40px,7.5vmin,62px);aspect-ratio:1;border-radius:50%;background:var(--pc);display:grid;place-items:center;
  font-size:clamp(24px,4.6vmin,38px);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.pinfo{min-width:0}
.pod .pname{font-family:var(--font-display);font-weight:700;font-size:clamp(14px,2.6vmin,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstats{display:flex;gap:10px;font-size:clamp(13px,2.3vmin,18px);font-variant-numeric:tabular-nums;white-space:nowrap}
.pod--r .pstats{justify-content:flex-end}
.pod.active{border-color:var(--pc);transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,255,255,.6),0 8px 20px rgba(42,40,64,.2)}
.pod.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.hud-mid{display:flex;align-items:center;gap:6px}
.hbtn{width:clamp(40px,7vmin,54px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:clamp(18px,3.4vmin,26px)}
.leafchip{display:flex;align-items:center;gap:4px;background:var(--gum);color:#fff;border-radius:999px;padding:.3em .7em;
  font-family:var(--font-display);font-size:clamp(16px,3vmin,24px);box-shadow:0 4px 0 var(--gum-deep);font-variant-numeric:tabular-nums}
.leafchip.bump{animation:bump .5s}
@media (max-width:520px){.pstats .brave,.pod .pname{display:none}.pod{padding-right:12px}.pod--r{padding-left:12px}.pstats{font-size:18px;font-family:var(--font-display)}}

/* ---------- Kooka dock ---------- */
#dock{position:fixed;z-index:6;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  display:none;align-items:flex-end;gap:6px;pointer-events:none;max-width:calc(100vw - 20px)}
body.dock-on #dock{display:flex}
.dock-kooka{width:clamp(72px,13vmin,120px);pointer-events:auto;flex:none;animation:hopIn .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hopIn{from{transform:translateY(120%)}}
#bubble{pointer-events:none;background:#fff;border-radius:24px;padding:.55em .9em;font-family:var(--font-display);font-weight:600;
  font-size:clamp(15px,2.7vmin,23px);line-height:1.2;box-shadow:0 6px 0 rgba(29,91,69,.15),0 14px 30px rgba(42,40,64,.18);
  margin-bottom:clamp(10px,3vmin,30px);max-width:min(66vw,460px);position:relative;text-wrap:balance}
#bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right:16px solid #fff;border-left:0}
#bubble:empty{display:none}
.kooka-svg{width:100%;height:auto;display:block;overflow:visible}
.k-body{animation:kbob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.k-eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.beak-lo{transform-box:fill-box;transform-origin:0% 30%}
body.talking .beak-lo{animation:beak .16s ease-in-out infinite alternate}
.laughing .beak-lo{animation:beak .1s ease-in-out infinite alternate}
.laughing .k-body{animation:laughShake .18s ease-in-out infinite alternate}
@keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px) rotate(-1deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes beak{to{transform:rotate(16deg)}}
@keyframes laughShake{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

/* ---------- Title ---------- */
.title-screen{gap:clamp(8px,2vmin,18px)}
.hero-kooka{width:clamp(130px,26vmin,240px);animation:flyIn 1.1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes flyIn{from{transform:translate(-60vw,-30vh) rotate(-30deg) scale(.5);opacity:0}}
.logo{font-family:var(--font-display);font-weight:700;line-height:.88;display:flex;flex-direction:column;align-items:center;margin:0}
.logo-top{font-size:clamp(42px,11vmin,118px)}
.logo-bot{font-size:clamp(58px,15.5vmin,168px)}
.logo .l{display:inline-block;color:var(--lc);animation:letterBob 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.14s);
  text-shadow:0 .05em 0 #fff,.05em 0 0 #fff,-.05em 0 0 #fff,0 -.05em 0 #fff,.036em .036em 0 #fff,-.036em .036em 0 #fff,.036em -.036em 0 #fff,-.036em -.036em 0 #fff,0 .13em 0 rgba(29,91,69,.3)}
@keyframes letterBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.06em) rotate(2deg)}}
.tagline{margin:0;font-size:clamp(16px,3vmin,24px);text-align:center;background:rgba(255,255,255,.8);padding:.35em .9em;border-radius:999px;color:var(--gum-deep);text-wrap:balance}

/* ---------- Setup ---------- */
.setup-cards{display:flex;gap:clamp(12px,2.5vmin,24px);flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
.pcard{flex:1 1 300px;max-width:420px;min-width:0;background:var(--paper);border-radius:30px;padding:16px;border:6px solid var(--pc);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center;animation:screenIn .5s both}
.pcard-head{display:flex;align-items:center;gap:12px}
.pcard-av{width:clamp(64px,12vmin,96px);aspect-ratio:1;border-radius:50%;background:var(--pc);display:grid;place-items:center;
  font-size:clamp(40px,7.6vmin,62px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);animation:avPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes avPop{from{transform:scale(.4) rotate(-20deg)}}
.pcard-label{font-family:var(--font-display);font-size:clamp(20px,3.6vmin,28px);color:var(--ink-soft)}
.pname-in{width:100%;font:inherit;font-family:var(--font-display);font-size:22px;text-align:center;padding:.4em .6em;border-radius:16px;
  border:3px solid #dfe8e2;background:#fff;color:var(--ink)}
.pname-in::placeholder{color:#a3a0b8}
.animal-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.ap{aspect-ratio:1;border-radius:16px;background:var(--mist);font-size:clamp(24px,5vmin,36px);display:grid;place-items:center;border:3px solid transparent;transition:transform .15s}
.ap.on{background:var(--ac);border-color:var(--ink);transform:scale(1.1)}
.ap:disabled{opacity:.25;filter:grayscale(1)}
.size-tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.size-tog button{border-radius:16px;padding:.55em .4em;background:var(--mist);font-family:var(--font-display);font-weight:600;font-size:clamp(14px,2.4vmin,18px);
  display:flex;align-items:center;justify-content:center;gap:.3em;border:3px solid transparent}
.size-tog button.on{background:#fff;border-color:var(--pc)}
.remove-p{font-size:15px;color:var(--ink-soft);text-decoration:underline;padding:4px}
.add-player{flex:1 1 300px;max-width:420px;min-height:180px;border-radius:30px;border:5px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.45);
  font-family:var(--font-display);font-size:clamp(20px,3.6vmin,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--gum-deep)}
.add-player .e{font-size:42px}

/* ---------- Map ---------- */
.map-wrap{flex:1;min-height:0;width:100%;max-width:1060px}
.map-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.road{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-dasharray:1 26}
.road.done{stroke:var(--wattle);stroke-dasharray:none;stroke-width:16}
.nc{fill:#fff;stroke:var(--gum-deep);stroke-width:6}
.node{cursor:pointer}
.node.locked .nc{fill:#eef6f0;stroke:#a3c9b2}
.node.locked .ne{opacity:.55}
.node.done .nc{fill:#fff3c4;stroke:#e0a91c}
.node.cur .nb{animation:nodePulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.node.cur .nc{stroke:var(--earth);stroke-width:9}
@keyframes nodePulse{50%{transform:scale(1.12)}}
.ne{font-size:50px;text-anchor:middle;dominant-baseline:central}
.nstar{font-size:30px;text-anchor:middle;dominant-baseline:central}
.nl{font-family:var(--font-display);font-weight:700;font-size:30px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:9px;stroke-linejoin:round}
.tok-in{animation:kbob 1s ease-in-out infinite}
.wave{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:.45;animation:wave 4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wave{to{transform:translateX(14px)}}
.deco{font-size:44px;text-anchor:middle;dominant-baseline:central}

/* ---------- Board (every game) ---------- */
.board{width:min(100%,980px);background:var(--paper);border-radius:34px;border:6px solid var(--theme);box-shadow:var(--shadow);
  padding:clamp(12px,2.4vmin,26px);display:flex;flex-direction:column;gap:clamp(10px,2vmin,20px);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:28px;
  background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.9),transparent 30%),radial-gradient(circle at 100% 100%,rgba(63,167,214,.06),transparent 40%)}
.board>*{position:relative;z-index:1}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--theme);color:#fff;font-family:var(--font-display);font-weight:700;
  font-size:clamp(15px,2.8vmin,22px);padding:.3em .9em .32em .6em;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.chip-n{background:rgba(255,255,255,.28);border-radius:999px;padding:0 .5em;font-variant-numeric:tabular-nums}
.prompt{display:flex;align-items:center;gap:clamp(6px,1.6vmin,14px)}
.mini-kooka{width:clamp(50px,9.5vmin,80px);flex:none}
.prompt-text{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:clamp(19px,4vmin,34px);line-height:1.15;
  background:var(--mist);border-radius:22px;padding:.45em .75em;position:relative;text-wrap:balance;min-height:2.1em;display:flex;align-items:center}
.prompt-text::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--mist);border-left:0}
.replay{width:clamp(46px,8.5vmin,62px);aspect-ratio:1;border-radius:50%;background:var(--gum);font-size:clamp(20px,3.8vmin,28px);display:grid;place-items:center;
  box-shadow:0 5px 0 var(--gum-deep);flex:none}
.replay:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gum-deep)}
.stim{display:flex;justify-content:center}
.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(10px,3vmin,28px)}
.choice{width:clamp(84px,19vmin,158px);aspect-ratio:1;border-radius:28px;background:#fff;border:4px solid #efe9db;
  box-shadow:0 8px 0 #ddd5c1,0 14px 24px rgba(42,40,64,.1);font-size:clamp(46px,10.5vmin,92px);display:grid;place-items:center;
  transition:transform .15s,opacity .3s,filter .3s;animation:choiceIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k) * 90ms + 150ms)}
.choice:active{transform:translateY(5px) scale(.97);box-shadow:0 3px 0 #ddd5c1}
@keyframes choiceIn{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.choice.no{animation:wobble .5s;opacity:.32;filter:grayscale(1);pointer-events:none}
.choice.yes{animation:yay .8s;border-color:var(--wattle);box-shadow:0 0 0 8px rgba(255,200,58,.5),0 8px 0 var(--wattle-deep)}
.solved .choice:not(.yes){opacity:.35;pointer-events:none}
@keyframes wobble{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
@keyframes yay{30%{transform:scale(1.22) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}

/* pattern train */
.train-wrap{width:100%;overflow:hidden;padding:30px 4px 6px;display:flex;justify-content:center}
.train{--w:clamp(28px,calc((100vw - 120px) / var(--n)),84px);display:flex;align-items:flex-end;gap:5px;position:relative;padding-bottom:calc(var(--w) * .22)}
.train::after{content:"";position:absolute;left:-30px;right:-30px;bottom:0;height:8px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#9a6a46 0 7px,transparent 7px 20px),linear-gradient(#777489,#777489) center/100% 3px no-repeat}
.wagon{width:var(--w);height:var(--w);border-radius:12px 12px 6px 6px;background:var(--wc);display:grid;place-items:center;position:relative;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.13);font-size:calc(var(--w) * .6);animation:wagonIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--k) * 70ms)}
@keyframes wagonIn{from{transform:translateX(-60vw)}}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:calc(var(--w) * -.2);width:calc(var(--w) * .28);aspect-ratio:1;border-radius:50%;background:#3d3a50;border:3px solid #fff}
.wagon::before{left:10%}.wagon::after{right:10%}
.wagon .e{filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.wagon.q{background:#fff;border:4px dashed var(--ink-soft);animation:wagonIn .5s both,qPulse 1.2s ease-in-out .8s infinite}
.qm{font-family:var(--font-display);font-weight:700;color:var(--ink-soft);font-size:calc(var(--w) * .6)}
@keyframes qPulse{50%{transform:translateY(-6px)}}
.engine{width:calc(var(--w) * 1.35);height:calc(var(--w) * 1.05);background:#e0493a;border-radius:10px 26px 6px 6px;position:relative;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);animation:wagonIn .5s both;animation-delay:calc(var(--k) * 70ms)}
.engine::before{content:"";position:absolute;left:14%;top:-34%;width:22%;height:40%;background:#3d3a50;border-radius:4px 4px 0 0}
.engine::after{content:"";position:absolute;bottom:calc(var(--w) * -.2);left:14%;width:calc(var(--w) * .32);aspect-ratio:1;border-radius:50%;background:#3d3a50;border:3px solid #fff;
  box-shadow:calc(var(--w) * .6) 0 0 -3px #3d3a50}
.engine .win{position:absolute;right:14%;top:16%;width:32%;height:34%;background:#bfe8ef;border-radius:6px;border:3px solid #fff}
.train.go{animation:chug 1.5s cubic-bezier(.6,0,.9,.5) forwards}
@keyframes chug{0%{transform:translateX(0)}12%{transform:translateX(-14px)}100%{transform:translateX(115vw)}}

/* shadow cave */
.cave{width:min(100%,560px);border-radius:40px 40px 30px 30px;padding:clamp(14px,3vmin,30px);display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 45%,#fff7da 0 34%,#f4d9a2 60%,#b98a55 100%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.spot{font-size:clamp(80px,19vmin,170px);animation:floaty 3s ease-in-out infinite;transition:filter .7s}
@keyframes floaty{50%{transform:translateY(-8px) rotate(2deg)}}
.sh{filter:brightness(0) opacity(.82);transition:filter .7s;display:inline-block}
.sh.flip{transform:scaleX(-1)}
.board--shadow .choice{background:#fbf3df}

/* counting creek */
.pond{position:relative;width:100%;max-height:44vh;border-radius:42% 48% 40% 50% / 46% 40% 52% 46%;overflow:hidden;
  background:radial-gradient(ellipse at 30% 30%,#8ee0f2,#3fa7d6 60%,#2d86ba);box-shadow:inset 0 -12px 0 rgba(0,0,0,.12),0 0 0 8px #9cd6a8}
.pond::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 18% 6% at 22% 70%,rgba(255,255,255,.35),transparent),
  radial-gradient(ellipse 14% 5% at 75% 25%,rgba(255,255,255,.3),transparent),radial-gradient(ellipse 12% 4% at 60% 82%,rgba(255,255,255,.25),transparent)}
.critter{position:absolute;transform:translate(-50%,-50%);font-size:clamp(30px,7.6vmin,66px);width:1.4em;height:1.4em;display:grid;place-items:center}
.critter .e{animation:bobble 2.4s ease-in-out infinite;animation-delay:var(--d);display:block}
@keyframes bobble{50%{transform:translateY(-6px) rotate(-5deg)}}
.critter.ticked .e{filter:drop-shadow(0 0 6px #fff)}
.tick{position:absolute;right:-.05em;top:-.05em;font-family:var(--font-display);font-weight:700;font-size:.42em;width:1.5em;aspect-ratio:1;border-radius:50%;
  background:var(--wattle);display:grid;place-items:center;box-shadow:0 3px 0 var(--wattle-deep);animation:popIn .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes popIn{from{transform:scale(0)}}
.choice.pad{border-radius:50%;background:radial-gradient(circle at 40% 35%,#b5e8a4,#62b36a);border-color:#4f9a58;box-shadow:0 8px 0 #3d7f45,0 14px 24px rgba(42,40,64,.12);
  display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.num{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,8.4vmin,74px);line-height:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:70%}
.dot{width:clamp(7px,1.3vmin,11px);aspect-ratio:1;border-radius:50%;background:var(--ink)}

/* silly spot */
.choices.odd .choice{width:clamp(76px,17vmin,150px)}

/* kookaburra song */
.branch-wrap{position:relative;width:100%;padding-top:10px}
.branch{position:absolute;left:-30px;right:-30px;bottom:6%;height:42%;width:calc(100% + 60px)}
.birds{position:relative;display:flex;justify-content:center;gap:clamp(8px,3vmin,34px)}
.bird{width:clamp(70px,18vmin,150px);color:var(--bc);position:relative;transition:transform .15s}
.bird svg{width:100%;display:block;transition:transform .15s;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.bird.sing svg{transform:translateY(-16%) scale(1.14)}
.bird.sing::after{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 65%);z-index:-1}
.bird:not(:disabled):active svg{transform:scale(.92)}
.bird.oops{animation:wobble .5s}
.note{position:absolute;left:50%;top:0;font-size:clamp(20px,4vmin,34px);color:var(--bc);font-family:var(--font-display);font-weight:700;pointer-events:none;
  animation:noteUp 1s ease-out forwards}
@keyframes noteUp{to{transform:translate(20px,-70px) rotate(20deg);opacity:0}}
.seqdots{display:flex;justify-content:center;gap:10px;min-height:22px}
.sd{width:clamp(16px,3vmin,24px);aspect-ratio:1;border-radius:50%;background:#e3e0d3;transition:background .2s,transform .2s}
.sd.lit{background:var(--ink-soft);transform:scale(1.2)}
.sd.on{background:var(--wattle);transform:scale(1.15)}
.board--echo.listening .birds{pointer-events:none}

/* billabong memory */
.mem-grid{--cw:min(19vw,calc((100vh - 330px) / 3 * .8),150px);display:grid;grid-template-columns:repeat(4,var(--cw));gap:clamp(8px,1.6vmin,16px);justify-content:center}
@supports (height:100dvh){.mem-grid{--cw:min(19vw,calc((100dvh - 330px) / 3 * .8),150px)}}
@media (max-aspect-ratio:4/5){.mem-grid{grid-template-columns:repeat(3,var(--cw));--cw:min(27vw,calc((100vh - 330px) / 4 * .8),150px)}
  @supports (height:100dvh){.mem-grid{--cw:min(27vw,calc((100dvh - 330px) / 4 * .8),150px)}}}
.mcard{width:var(--cw);height:calc(var(--cw) * 1.25);display:block;animation:choiceIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k) * 45ms)}
.minner{display:block;position:relative;width:100%;height:100%}
.minner.flipping{animation:flip2d .34s ease-in-out}
@keyframes flip2d{50%{transform:scaleX(0)}}
.mface{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:18px;display:flex;align-items:center;justify-content:center}
.mface.front{visibility:hidden}
.mcard.up .mface.front{visibility:visible}
.mcard.up .mface.back{visibility:hidden}
.mface.back{background:radial-gradient(circle,rgba(255,255,255,.2) 0 3px,transparent 4px) 0 0/18px 18px,linear-gradient(140deg,#4fb0d9,#2f86c0);
  box-shadow:0 6px 0 #22668f,inset 0 0 0 4px rgba(255,255,255,.5);color:#fff;font-family:var(--font-display);font-weight:700;font-size:calc(var(--cw) * .45)}
.mface.front{background:#fff;font-size:calc(var(--cw) * .6);box-shadow:0 6px 0 #ddd5c1,inset 0 0 0 4px #efe9db}
.mcard.matched .front{box-shadow:0 6px 0 var(--wattle-deep),inset 0 0 0 5px var(--wattle)}
.mcard.matched .minner{animation:yay .8s}

/* calm cove */
.calm{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vmin,30px);width:100%;padding-block:10px}
.breath{width:clamp(150px,38vmin,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transform:scale(.55);transition:transform 4s ease-in-out;
  background:radial-gradient(circle at 34% 30%,#fff 0 6%,rgba(255,255,255,.55) 7% 13%,transparent 14%),radial-gradient(circle,#b7f0ea,#3fb8c9);
  box-shadow:0 0 0 14px rgba(63,184,201,.16),0 0 70px rgba(63,184,201,.55);color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(48px,11vmin,110px)}
.breath.in{transform:scale(1)}
.flower,.candle{font-size:clamp(40px,9vmin,84px);opacity:.35;transform:scale(.8);transition:opacity .5s,transform .5s}
.flower.active,.candle.active{opacity:1;transform:scale(1.15)}

/* end, stretch, rest */
.tree-wrap{flex:1;min-height:180px;width:100%;display:flex;justify-content:center}
.tree-svg{height:100%;max-width:100%;overflow:visible}
.leaf{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.8,.5,1)}
.leaf.on{transform:scale(1)}
.koala{opacity:0;transition:opacity .4s}
.show-koala .koala{opacity:1;animation:popIn .5s cubic-bezier(.3,1.8,.5,1)}
.summary{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sum>div{min-width:0}
.sum{max-width:100%;display:flex;align-items:center;gap:10px;background:var(--paper);border:5px solid var(--pc);border-radius:24px;padding:8px 16px 8px 8px;box-shadow:0 6px 0 rgba(29,91,69,.15)}
.sum-av{width:clamp(48px,9vmin,70px);aspect-ratio:1;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:clamp(28px,5.4vmin,42px)}
.sum-name{font-family:var(--font-display);font-size:clamp(18px,3.4vmin,26px)}
.sum-stats{display:flex;gap:12px;font-size:clamp(14px,2.6vmin,19px);color:var(--ink-soft);flex-wrap:wrap}
.mover{width:clamp(150px,34vmin,300px);font-size:clamp(110px,26vmin,230px);display:grid;place-items:center;text-align:center}
.mover.hop{animation:hopMove .9s cubic-bezier(.3,0,.6,1) infinite}
@keyframes hopMove{0%,100%{transform:translateY(0) scaleY(.9)}45%{transform:translateY(-28%) scaleY(1.05)}}
.mover.stretchup{animation:stretchUp 2.5s ease-in-out infinite;transform-origin:bottom}
@keyframes stretchUp{50%{transform:scaleY(1.22) scaleX(.92)}}
.mover.flap{animation:flapMove .45s ease-in-out infinite alternate}
@keyframes flapMove{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-12px)}}
.move-text{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5.6vmin,50px);text-align:center;text-wrap:balance;margin:0;
  background:rgba(255,255,255,.88);padding:.3em .9em;border-radius:28px}
.counter{font-family:var(--font-display);font-weight:700;font-size:clamp(60px,14vmin,130px);color:var(--earth);line-height:1;min-height:1em;
  text-shadow:0 5px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 -4px 0 #fff;font-variant-numeric:tabular-nums}
.counter.pop{animation:yay .5s}
.medal{font-size:clamp(90px,20vmin,180px);animation:floaty 3s ease-in-out infinite}
.rest-text{margin:0;max-width:34ch;text-align:center;font-family:var(--font-display);font-weight:600;font-size:clamp(19px,3.6vmin,30px);
  background:rgba(255,255,255,.88);padding:.5em .9em;border-radius:24px;text-wrap:balance}
.rest-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.hold{--p:0;font-family:var(--font-display);font-weight:600;font-size:clamp(15px,2.6vmin,19px);padding:.7em 1.3em;border-radius:999px;color:var(--ink);
  background:linear-gradient(90deg,var(--wattle) calc(var(--p) * 100%),rgba(255,255,255,.85) 0);border:3px solid rgba(29,91,69,.25);touch-action:none}

/* overlays */
.banner{position:fixed;inset:0;display:grid;place-items:center;z-index:40;pointer-events:none;overflow:hidden}
.ribbon{background:var(--pc);color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(32px,7.6vmin,72px);padding:.25em 1.1em .3em .5em;
  border-radius:999px;display:flex;align-items:center;gap:.35em;box-shadow:0 10px 0 rgba(0,0,0,.15),0 30px 60px rgba(42,40,64,.3);
  animation:ribbon 1.7s cubic-bezier(.3,1.2,.5,1) both;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.ribbon .e{font-size:1.3em;background:rgba(255,255,255,.3);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
@keyframes ribbon{0%{transform:translateX(-120vw) rotate(-8deg)}22%{transform:translateX(0) rotate(-3deg)}78%{transform:translateX(0) rotate(-3deg)}100%{transform:translateX(120vw) rotate(-8deg)}}
.flyer{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-size:46px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
.modal{position:fixed;inset:0;z-index:70;background:rgba(29,40,50,.45);display:grid;place-items:center;padding:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal-card{background:var(--paper);border-radius:28px;padding:clamp(18px,3vmin,30px);max-width:560px;width:100%;max-height:86vh;overflow:auto;
  box-shadow:var(--shadow);animation:screenIn .4s cubic-bezier(.2,1.3,.4,1) both;user-select:text;-webkit-user-select:text}
.modal-card h3{font-family:var(--font-display);font-size:clamp(22px,4vmin,30px);margin:0 0 .4em}
.modal-card h4{font-family:var(--font-display);font-size:19px;margin:1em 0 .3em;color:var(--gum-deep)}
.modal-card p,.modal-card li{font-weight:600;line-height:1.5;font-size:16px;color:var(--ink)}
.modal-card ul{padding-left:1.2em;margin:.2em 0}
.modal-card b{font-weight:800}
.modal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mbtn{font-family:var(--font-display);font-weight:700;font-size:20px;padding:.5em 1.3em;border-radius:999px;background:var(--mist);box-shadow:0 5px 0 #cdd9d1}
.mbtn.primary{background:var(--wattle);box-shadow:0 5px 0 var(--wattle-deep)}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:16px;margin-top:10px}
.toggle-row input{width:24px;height:24px;accent-color:var(--gum)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const body=document.body, stage=$('#stage');

/* ---------- data ---------- */
const ANIMALS=[
  {e:'🦘',name:'Kangaroo',c:'#f0882f'},{e:'🐨',name:'Koala',c:'#9b6bd6'},{e:'🐧',name:'Penguin',c:'#2f86de'},

function tone(f,dur=.2,type='sine',vol=.15,when=0,from=null,glide=.06){
  const a=S.sound&&ac();if(!a)return;
  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;
  if(from){o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(f,t+glide)}else o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

async function runQuiz(si,gen){

const PAT_SETS=[['🔴','🔵','🟡','🟢','🟣','🟠'],['🍎','🍌','🍇','🍓','🍊','🥝'],['🦘','🐨','🐧','🐢','🦜','🐊'],['⭐','🌙','☀️','☁️','🌈','⚡'],['🚗','🚌','🚲','🚁','⛵','🚀']];
const UNITS={1:['AB'],2:['AAB','ABB'],3:['ABC','AABB'],4:['ABCC','AABC','ABBC'],5:['ABCD','ABCB']};
const WAGONC=['#ff9f6e','#7cc6f2','#b79cf0','#8fdc9b','#ffd36e','#f59ac0'];
function genPattern(L){
  const unit=pick(UNITS[L]),letters=[...new Set(unit)],set=pick(PAT_SETS),items=sample(set,letters.length+1),map={};
  letters.forEach((l,i)=>map[l]=items[i]);const extra=items[letters.length];
  const shown=Math.min(9,unit.length*2+rand(unit.length));
  const seq=Array.from({length:shown},(_,i)=>map[unit[i%unit.length]]),answer=map[unit[shown%unit.length]];
  const others=shuffle(letters.map(l=>map[l]).filter(x=>x!==answer));
  let distract=L>=3?others.slice(0,2):others.slice(0,1);if(distract.length<2)distract.push(extra);
  const choices=shuffle([answer,...distract]).map(e=>({html:`<span class="e">${e}</span>`,ok:e===answer}));
  const stim=`<div class="train-wrap"><div class="train" style="--n:${shown+3}">${seq.map((e,i)=>`<div class="wagon" style="--wc:${WAGONC[i%6]};--k:${i}"><span class="e">${e}</span></div>`).join('')}
    <div class="wagon q" style="--wc:${WAGONC[shown%6]};--k:${shown}"><span class="qm">?</span></div><div class="engine" style="--k:${shown+1}"><span class="win"></span></div></div></div>`;
  return{say:L<=1?'What comes next on the Pattern Train? Say the pattern out loud!':'What comes next on the Pattern Train?',stim,choices,
    onCorrect:async(board,btn)=>{const q=$('.wagon.q',board);flyTo(btn,q,answer,52);await wait(820);q.classList.remove('q');q.innerHTML=`<span class="e">${answer}</span>`;

/* ---------- Counting Creek ---------- */
const CRITTERS=[['🐟','fish','fish'],['🦆','duck','ducks'],['🐸','frog','frogs'],['🐢','turtle','turtles'],['🦀','crab','crabs'],['🐠','fish','fish']];
const COUNT_RANGE={1:[1,3],2:[2,5],3:[3,7],4:[4,9],5:[6,10]};
function genCount(L){
  const[lo,hi]=COUNT_RANGE[L],n=lo+rand(hi-lo+1),[emo,one,many]=pick(CRITTERS);
  const portrait=innerHeight>innerWidth,cols=portrait?4:5,rows=portrait?3:2;
  const cells=sample([...Array(cols*rows).keys()],n);
  const crit=cells.map((c,i)=>{const col=c%cols,row=Math.floor(c/cols);
    const x=(col+.5+(Math.random()-.5)*.36)/cols*100,y=(row+.5+(Math.random()-.5)*.3)/rows*100;
    return `<button class="critter" style="left:${(8+x*.84).toFixed(1)}%;top:${(10+y*.8).toFixed(1)}%" aria-label="${one}"><span class="e" style="--d:${(-Math.random()*2.4).toFixed(2)}s">${emo}</span></button>`}).join('');
  const opts=new Set([n]);const spread=L<=2?2:1;
  while(opts.size<3){const d=(rand(2)?1:-1)*(1+rand(spread)),v=n+d;if(v>=1&&v<=10)opts.add(v);else opts.add(clamp(n+(opts.size===1?1:2)*(n>5?-1:1),1,10))}
  const choices=shuffle([...opts]).map(v=>({cls:'pad',ok:v===n,html:`<span class="num">${v}</span>${L<=2?`<span class="dots">${'<i class="dot"></i>'.repeat(v)}</span>`:''}`}));
  return{say:`How many ${many} are in the creek? Tap each one to count!`,
    stim:`<div class="pond" style="aspect-ratio:${portrait?'1.25/1':'2.1/1'}">${crit}</div>`,choices,
    explain:n===1?`Just one ${one}!`:`${cap(WORDS[n])} ${many}!`,
    mount(board){let k=0;$('.pond',board).addEventListener('click',e=>{const c=e.target.closest('.critter');if(!c||board.classList.contains('solved'))return;
      if(c.classList.contains('ticked')){k=0;$$('.critter',board).forEach(x=>{x.classList.remove('ticked');$('.tick',x)?.remove()});say("Let's count again from the start!",{quiet:true});sfx.soft();return}
      k++;c.classList.add('ticked');c.insertAdjacentHTML('beforeend',`<span class="tick">${k}</span>`);sfx.count(k);say(WORDS[k]||String(k),{quiet:true})})},
    onCorrect:async board=>{const cs=$$('.critter',board);cs.forEach(c=>{c.classList.remove('ticked');$('.tick',c)?.remove()});
      for(let i=0;i<cs.length;i++){cs[i].classList.add('ticked');cs[i].insertAdjacentHTML('beforeend',`<span class="tick">${i+1}</span>`);sfx.count(i+1);await wait(230)}}};
}

    <div class="calm"><div class="flower e">🌸</div><div class="breath" id="breath"><span id="bcount"></span></div><div class="candle e">🕯️</div></div>
    <div style="display:flex;justify-content:center"><button class="btn-big" id="readyBtn" hidden>I feel ready! <span class="e">😊</span></button></div></div></div>`;
  const br=$('#breath'),bc=$('#bcount'),fl=$('.flower'),ca=$('.candle');
  S.lastPrompt="Let's take three big, slow breaths together.";
  await say("Let's take three big, slow breaths together. Everybody ready?");await wait(400);
  for(let i=0;i<3;i++){
    fl.classList.add('active');ca.classList.remove('active');br.classList.add('in');sfx.breathIn();say('Smell the flower. Breathe in...');
    for(let k=1;k<=4;k++){bc.textContent=k;await wait(1000)}
    fl.classList.remove('active');ca.classList.add('active');br.classList.remove('in');sfx.breathOut();say('Blow out the candle. Breathe out...');
    for(let k=4;k>=1;k--){bc.textContent=k;await wait(1100)}
  }
  bc.textContent='';ca.classList.remove('active');
  await say('Beautiful. Your brain feels calm and ready to think.');
  const rb=$('#readyBtn');rb.hidden=false;
  await new Promise(r=>rb.onclick=()=>{sfx.pop();r()});
}

const GAMES={memory:gameMemory,echo:gameEcho,pattern:i=>runQuiz(i,genPattern),calm:gameCalm,shadow:i=>runQuiz(i,genShadow),count:i=>runQuiz(i,genCount),odd:i=>runQuiz(i,genOdd)};

/* ---------- End: the Wonder Tree ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function treeSVG(){const R=rng(11),LC=['#3c8d68','#57a87b','#2f7a59','#7cc08f'];let slots='';
  for(let i=0;i<30;i++){const a=R()*6.283,r=Math.sqrt(R()),x=200+Math.cos(a)*r*142,y=135+Math.sin(a)*r*84,rot=Math.round(R()*360);
    const inner=i%5===4?'<circle r="8" fill="#ffc83a"/><circle cx="9" cy="5" r="7" fill="#ffd866"/><circle cx="-8" cy="6" r="6" fill="#ffb81c"/>'
      :i%7===6?'<circle r="10" fill="#f59ac0"/><circle r="4" fill="#fff3c4"/>'
      :`<ellipse rx="18" ry="7.5" fill="${LC[i%4]}"/><path d="M-15 0 H15" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>`;
    slots+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})"><g class="leaf">${inner}</g></g>`}
  return `<svg class="tree-svg" viewBox="0 0 400 400" role="img" aria-label="The Wonder Tree">
  <ellipse cx="200" cy="386" rx="140" ry="13" fill="rgba(29,91,69,.22)"/>
  <path d="M196 386 C200 330 186 290 198 240 C204 214 196 196 186 176" stroke="#efe7d9" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M198 250 C222 222 246 206 268 176 M194 292 C168 270 146 252 128 222 M190 200 C176 186 160 178 140 160 M200 230 C214 208 226 190 230 160" stroke="#efe7d9" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M192 366 C194 330 188 300 194 270" stroke="#cdbfa8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
  <g fill="#e2f1e6" opacity=".75"><ellipse cx="200" cy="128" rx="150" ry="86"/><ellipse cx="108" cy="168" rx="70" ry="44"/><ellipse cx="292" cy="168" rx="70" ry="44"/></g>
  ${slots}<text class="koala e" x="276" y="186" font-size="54" text-anchor="middle">🐨</text></svg>`}
function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function dayCount(){const v=store.get('ki-days',{});return v.d===today()?v.n:0}
function bumpDay(){store.set('ki-days',{d:today(),n:dayCount()+1})}
function showEnd(){
  const sid=S.sid;mode('dock');setTurn(-1);bumpDay();
  stage.innerHTML=`<div class="screen fill end-screen"><h2 class="h2">Our Wonder Tree</h2><div class="tree-wrap">${treeSVG()}</div>
    <div class="summary">${S.players.map(p=>`<div class="sum" style="--pc:${p.a.c}"><span class="sum-av e">${p.a.e}</span><div><div class="sum-name">${esc(p.name)}</div>
      <div class="sum-stats"><span><span class="e">⭐</span> ${p.stars} stars</span><span><span class="e">💪</span> ${p.brave} tried again</span></div></div></div>`).join('')}</div>
    <button class="btn-big go-pulse" id="wiggleBtn" disabled>Wiggle time! <span class="e">🦘</span></button></div>`;
  const leaves=$$('.leaf'),btn=$('#wiggleBtn');btn.onclick=()=>{sfx.pop();showStretch()};
  (async()=>{
    await say(S.players.length>1?'Look! Together you grew the Wonder Tree!':'Look! You grew the Wonder Tree!');
    const n=Math.min(S.tree,leaves.length);for(let i=0;i<n;i++){leaves[i].classList.add('on');sfx.leaf();await wait(reduced?10:120)}
    $('.tree-svg').classList.add('show-koala');sfx.fanfare();rain(130);
    const brave=S.players.some(p=>p.brave>0);
    await say(`${S.tree} leaves! ${S.players.length>1?'What a team!':'You are a super thinker!'}${brave?' And you never gave up when things got tricky.':''}`);
    if(sid===S.sid)btn.disabled=false;
  })();
}
async function showStretch(){
  mode('game');setTurn(-1);
  const MOVES=[{e:'🦘',t:'Hop like a kangaroo!',n:5,cls:'hop'},{e:'🌳',t:'Reach up tall like a gum tree!',n:5,cls:'stretchup'},
    {k:true,t:'Flap your wings like a kookaburra!',n:6,cls:'flap'},{k:true,t:'Now laugh like a kookaburra! Ha ha ha!',n:0,cls:'laughing'}];
  for(const m of MOVES){
    stage.innerHTML=`<div class="screen"><div class="mover ${m.cls} ${m.k?'':'e'}">${m.k?kookaSVG():m.e}</div><p class="move-text">${m.t}</p><div class="counter" id="ctr"></div></div>`;
    await say(m.t);
    if(!m.n){sfx.laugh();await wait(900);sfx.laugh();await wait(1500);continue}
    const ctr=$('#ctr');
    for(let k=1;k<=m.n;k++){ctr.textContent=k;ctr.classList.remove('pop');void ctr.offsetWidth;ctr.classList.add('pop');sfx.count(k);say(WORDS[k],{quiet:true});await wait(1150)}
    await wait(300);
  }
  showRest();
}
function showRest(){
  mode('dock');$('#hud').hidden=true;const n=dayCount();
  stage.innerHTML=`<div class="screen rest"><div class="medal e">🏅</div><h2 class="h2">Adventure complete!</h2>
    <p class="rest-text">Brains grow strong when you play outside, eat yummy food and have a good sleep.</p>
    ${n>=2?`<p class="rest-text">That's ${n} adventures today. Time for a real-world adventure!</p>
      <div class="rest-btns"><button class="btn-big" id="byeBtn">Go play outside <span class="e">🌞</span></button></div>
      <button class="hold" id="holdBtn">Grown-ups: hold to play again</button>`
    :`<div class="rest-btns"><button class="btn-big" id="againBtn">Play again</button><button class="btn-big alt" id="byeBtn">All done <span class="e">👋</span></button></div>`}</div>`;
  say(n>=2?"What a brainy day! Now it's time for a real adventure outside. See you tomorrow!":'Amazing adventure! You can play again, or go and explore the real world. See you next time!');
  $('#byeBtn').onclick=()=>{sfx.pop();renderTitle()};
  $('#againBtn')&&($('#againBtn').onclick=()=>{sfx.pop();renderSetup()});
  const h=$('#holdBtn');
  if(h){let t0=0,raf=0;const tick=t=>{const k=Math.min(1,(t-t0)/3000);h.style.setProperty('--p',k);if(k>=1){stop();sfx.pop();renderSetup()}else raf=requestAnimationFrame(tick)};
    const stop=()=>{cancelAnimationFrame(raf);h.style.setProperty('--p',0)};
    h.addEventListener('pointerdown',e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(tick)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,stop));h.addEventListener('contextmenu',e=>e.preventDefault())}
}

renderTitle();
})();
</script>
